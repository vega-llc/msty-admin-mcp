name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_public_boundary.py .

  test:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - run: uv run --frozen ruff check msty_ops scripts tests
      - run: uv run --frozen black --check msty_ops scripts tests
      - run: uv run --frozen pytest -q
      - run: uv pip check

  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --frozen python -m build --no-isolation
      - run: python -m venv "${RUNNER_TEMP}/wheel-check"
      - run: |
          "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install dist/*.whl
      - run: |
          "${RUNNER_TEMP}/wheel-check/bin/python" -c "import msty_ops; assert msty_ops.__version__ == '1.0.0'"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/

  dependency-audit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv export --frozen --no-dev --no-emit-project --format requirements.txt --output-file requirements-audit.txt
      - run: git diff --exit-code -- requirements-audit.txt
      - run: uv run --frozen pip-audit --strict --disable-pip -r requirements-audit.txt
