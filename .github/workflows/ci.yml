name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_public_boundary.py .
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.21"
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - run: uv run --frozen ruff check msty_ops scripts tests
      - run: uv run --frozen black --check msty_ops scripts tests
      - run: uv run --frozen pytest -q
      - run: uv pip check

  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.21"
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --frozen python -m build --no-isolation
      - run: python -m venv "${RUNNER_TEMP}/wheel-check"
      - run: |
          "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install dist/*.whl
      - run: |
          "${RUNNER_TEMP}/wheel-check/bin/python" -c "import msty_ops; assert msty_ops.__version__ == '1.0.0'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/

  dependency-audit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.21"
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv export --frozen --no-dev --no-emit-project --format requirements.txt --output-file requirements-audit.txt
      - run: git diff --exit-code -- requirements-audit.txt
      - run: uv run --frozen pip-audit --strict --disable-pip -r requirements-audit.txt
