[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "msty-local-ops"
version = "1.0.0"
description = "Fail-closed MCP diagnostics and bounded local inference for Msty Studio"
readme = "README.md"
license = "MIT"
authors = [{ name = "Msty Local Ops contributors" }]
keywords = ["mcp", "msty", "local-llm", "mlx", "llamacpp", "apple-silicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "mcp==2.0.0",
    "psutil>=5.9.0,<8",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "build>=1.2.0",
    "pip-audit>=2.7.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
msty-local-ops = "msty_ops.server:main"
msty-local-inference = "msty_ops.local_server:main"

[project.urls]
Upstream = "https://github.com/M-Pineapple/msty-admin-mcp"
Msty = "https://msty.ai/products/studio/"

[tool.hatch.build.targets.wheel]
packages = ["msty_ops"]

[tool.hatch.build.targets.sdist]
include = [
    "/msty_ops",
    "/README.md",
    "/LICENSE",
    "/NOTICE.md",
    "/PRIVACY.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
